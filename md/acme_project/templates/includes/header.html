<header>
  <nav class="navbar shadow-sm">
    <div class="container">
      {% with request.resolver_match.view_name as view_name %}
        <ul class="nav nav-pills">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'pages:homepage' %}">Главная</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'birthday:list' %}">Список дней рождения</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'birthday:create' %}">Калькулятор дней рождения</a>
          </li>

          {% if user.is_authenticated %}
            <li class="nav-item">
              <span class="navbar-text">Пользователь: <b>{{ user.username }}</b></span>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'logout' %}">Выйти</a>
            </li>
          {% else %}
            <li class="nav-item">
              <a class="nav-link{% if view_name == 'login' %} active {% endif %}" href="{% url 'login' %}">Войти</a>
            </li>
            <li class="nav-item">
              <a class="nav-link{% if view_name == 'registration' %} active {% endif %}" href="{% url 'registration' %}">Регистрация</a>
            </li>
          {% endif %}
        </ul>
      {% endwith %}
    </div>
  </nav>
</header>
